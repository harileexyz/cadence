databases:
  - name: cadence-db
    plan: free
    databaseName: cadence
    user: cadence

services:
  - type: web
    name: cadence
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cadence-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: PUBLIC_MEDIA_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
