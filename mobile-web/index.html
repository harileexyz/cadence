<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Cadence</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #4f46e5, #db2777);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 28px;
        margin-bottom: 16px;
      }
      p {
        color: #94a3b8;
        font-size: 14px;
        max-width: 280px;
        line-height: 1.5;
      }
      a {
        margin-top: 16px;
        display: inline-block;
        padding: 10px 20px;
        border-radius: 10px;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="badge">C</div>
    <h1 style="font-size: 20px; margin: 0 0 8px">Connecting to Cadence…</h1>
    <p>Make sure you have an active internet connection to load cadences.in.</p>
    <a href="https://cadences.in">Retry Connection</a>
  </body>
</html>
